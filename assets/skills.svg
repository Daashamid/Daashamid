<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Skill levels: Python 80%, Linux 65%, HTML / CSS 60%, Network+ 50%, C / C++ 35%, Pentest 25%">
  <title>$ ./progress.sh</title>
  <defs>
    <linearGradient id="bgk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/><stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="fillk" gradientUnits="userSpaceOnUse"
                    x1="168" y1="0" x2="568" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="55%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <linearGradient id="rulek" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="26%" stop-color="#00ff88" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shinek" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridk" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#00ff88" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="cardk"><rect width="1000" height="300" rx="14"/></clipPath>
  </defs>
  <style>
    .mk { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 0.2px; }
    .sh { animation: sh 5.2s ease-in-out infinite; }
    @keyframes sh {
      0%      { transform: translateX(0) }
      55%,
      100%    { transform: translateX(620px) }
    }
  </style>
  <g clip-path="url(#cardk)">
    <rect width="1000" height="300" fill="url(#bgk)"/>
    <rect width="1000" height="300" fill="url(#gridk)"/>
    <rect width="1000" height="36" fill="#0d1117"/>
    <circle cx="26" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="45" cy="18" r="5" fill="#febc2e"/>
    <circle cx="64" cy="18" r="5" fill="#28c840"/>
    <text class="mk" x="500" y="22" font-size="11.5" fill="#6e7681"
          text-anchor="middle" letter-spacing="0.6">progress.sh — 120×24</text>
    <path d="M0 36h1000" stroke="#30363d" stroke-opacity="0.7"/>
      <text class="mk" x="28" y="62"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">./progress.sh</tspan><tspan fill="#484f58" dx="16">#</tspan><tspan fill="#6e7681" dx="8">honest numbers, updated as they move</tspan></text>
      <text class="mk" x="28" y="96" fill="#8b949e">Python</text>
      <clipPath id="c0"><rect x="168" y="89.5" width="320.0" height="11" rx="5.5"/></clipPath>
      <rect x="168" y="89.5" width="400" height="11" rx="5.5" fill="#161b22"/>
      <rect x="168" y="89.5" width="320.0" height="11" rx="5.5" fill="url(#fillk)"/>
      <g clip-path="url(#c0)"><rect class="sh" x="58" y="89.5" width="110" height="11" fill="url(#shinek)" style="animation-delay:0.00s"/></g>
      <text class="mk" x="612" y="96" fill="#f0f6fc" text-anchor="end" font-weight="600">80%</text>
      <text class="mk" x="644" y="96" fill="#6e7681">OOP · files · bots · automation</text>
      <text class="mk" x="28" y="130" fill="#8b949e">Linux</text>
      <clipPath id="c1"><rect x="168" y="123.5" width="260.0" height="11" rx="5.5"/></clipPath>
      <rect x="168" y="123.5" width="400" height="11" rx="5.5" fill="#161b22"/>
      <rect x="168" y="123.5" width="260.0" height="11" rx="5.5" fill="url(#fillk)"/>
      <g clip-path="url(#c1)"><rect class="sh" x="58" y="123.5" width="110" height="11" fill="url(#shinek)" style="animation-delay:0.42s"/></g>
      <text class="mk" x="612" y="130" fill="#f0f6fc" text-anchor="end" font-weight="600">65%</text>
      <text class="mk" x="644" y="130" fill="#6e7681">bash · services · permissions</text>
      <text class="mk" x="28" y="164" fill="#8b949e">HTML / CSS</text>
      <clipPath id="c2"><rect x="168" y="157.5" width="240.0" height="11" rx="5.5"/></clipPath>
      <rect x="168" y="157.5" width="400" height="11" rx="5.5" fill="#161b22"/>
      <rect x="168" y="157.5" width="240.0" height="11" rx="5.5" fill="url(#fillk)"/>
      <g clip-path="url(#c2)"><rect class="sh" x="58" y="157.5" width="110" height="11" fill="url(#shinek)" style="animation-delay:0.84s"/></g>
      <text class="mk" x="612" y="164" fill="#f0f6fc" text-anchor="end" font-weight="600">60%</text>
      <text class="mk" x="644" y="164" fill="#6e7681">layout · responsive</text>
      <text class="mk" x="28" y="198" fill="#8b949e">Network+</text>
      <clipPath id="c3"><rect x="168" y="191.5" width="200.0" height="11" rx="5.5"/></clipPath>
      <rect x="168" y="191.5" width="400" height="11" rx="5.5" fill="#161b22"/>
      <rect x="168" y="191.5" width="200.0" height="11" rx="5.5" fill="url(#fillk)"/>
      <g clip-path="url(#c3)"><rect class="sh" x="58" y="191.5" width="110" height="11" fill="url(#shinek)" style="animation-delay:1.26s"/></g>
      <text class="mk" x="612" y="198" fill="#f0f6fc" text-anchor="end" font-weight="600">50%</text>
      <text class="mk" x="644" y="198" fill="#6e7681">TCP/IP · subnetting · DNS</text>
      <text class="mk" x="28" y="232" fill="#8b949e">C / C++</text>
      <clipPath id="c4"><rect x="168" y="225.5" width="140.0" height="11" rx="5.5"/></clipPath>
      <rect x="168" y="225.5" width="400" height="11" rx="5.5" fill="#161b22"/>
      <rect x="168" y="225.5" width="140.0" height="11" rx="5.5" fill="url(#fillk)"/>
      <g clip-path="url(#c4)"><rect class="sh" x="58" y="225.5" width="110" height="11" fill="url(#shinek)" style="animation-delay:1.68s"/></g>
      <text class="mk" x="612" y="232" fill="#f0f6fc" text-anchor="end" font-weight="600">35%</text>
      <text class="mk" x="644" y="232" fill="#6e7681">pointers · memory</text>
      <text class="mk" x="28" y="266" fill="#8b949e">Pentest</text>
      <clipPath id="c5"><rect x="168" y="259.5" width="100.0" height="11" rx="5.5"/></clipPath>
      <rect x="168" y="259.5" width="400" height="11" rx="5.5" fill="#161b22"/>
      <rect x="168" y="259.5" width="100.0" height="11" rx="5.5" fill="url(#fillk)"/>
      <g clip-path="url(#c5)"><rect class="sh" x="58" y="259.5" width="110" height="11" fill="url(#shinek)" style="animation-delay:2.10s"/></g>
      <text class="mk" x="612" y="266" fill="#f0f6fc" text-anchor="end" font-weight="600">25%</text>
      <text class="mk" x="644" y="266" fill="#6e7681">TryHackMe next →</text>
    <rect x="0" y="296" width="1000" height="4" fill="url(#rulek)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none"
        stroke="#30363d" stroke-opacity="0.85"/>
</svg>
