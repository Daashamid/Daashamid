<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640"
     role="img" aria-label="Terminal session: whoami, focus, projects, toolbox, lessons, learning status">
  <title>hamid@arch — terminal</title>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="trule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00ff88" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#00ff88" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="tscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity="0.014"/>
    </pattern>
    <clipPath id="tcard"><rect width="520" height="640" rx="12"/></clipPath>
  </defs>

  <style>
    .m  { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code",
          Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .bk { animation: bk 1.05s steps(1, end) infinite; }
    @keyframes bk { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
  </style>

  <g clip-path="url(#tcard)">
    <rect width="520" height="640" fill="url(#tbg)"/>
    <rect width="520" height="640" fill="url(#tgrid)"/>
    <ellipse cx="90" cy="600" rx="360" ry="240" fill="url(#tglow)"/>

    <!-- title bar -->
    <rect width="520" height="36" fill="#0d1117"/>
    <circle cx="24" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="60" cy="18" r="4.5" fill="#28c840"/>
    <text class="m" x="260" y="22" font-size="11.5" fill="#6e7681" text-anchor="middle"
          letter-spacing="0.5">bash — 80×24</text>
    <path d="M0 36h520" stroke="#30363d" stroke-opacity="0.7"/>
    <g class="m" letter-spacing="0.2">
      <text x="22" y="68"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">whoami</tspan></text>
      <text x="22" y="89" fill="#8b949e">hamid · python developer · iran</text>

      <text x="22" y="120"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">cat ~/.focus</tspan></text>
      <text x="22" y="141" fill="#8b949e">python <tspan fill="#00ff88">→</tspan> linux <tspan
        fill="#00ff88">→</tspan> network+ <tspan fill="#00ff88">→</tspan> pentest</text>

      <text x="22" y="172"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">ls ~/projects</tspan></text>
      <text x="22" y="193" fill="#79c0ff">auto-wifi-biruni    backlight-keyboard</text>

      <text x="22" y="224"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">cat ~/.toolbox</tspan></text>
      <text x="22" y="245" fill="#8b949e">python · bash · git · systemd</text>
      <text x="22" y="265" fill="#8b949e">selenium · evdev · requests</text>

      <text x="22" y="296"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">tail -3 ~/.lessons</tspan></text>
      <text x="22" y="317" fill="#6e7681"><tspan fill="#00ff88">&gt;</tspan><tspan dx="6"
        >read the error before you google it</tspan></text>
      <text x="22" y="337" fill="#6e7681"><tspan fill="#00ff88">&gt;</tspan><tspan dx="6"
        >if it runs once, put it on a timer</tspan></text>
      <text x="22" y="357" fill="#6e7681"><tspan fill="#00ff88">&gt;</tspan><tspan dx="6"
        >nothing is learned until it breaks</tspan></text>

      <text x="22" y="388"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">systemctl status learning</tspan></text>
      <text x="22" y="409"><tspan fill="#28c840">●</tspan><tspan fill="#8b949e" dx="6"
        >learning.service — </tspan><tspan fill="#00ff88">active (running)</tspan></text>
      <text x="46" y="429" fill="#6e7681">since 2025-07 · restarts: many · failures: 0</text>
      <text x="46" y="449" fill="#6e7681">next: TryHackMe → Jr Pentester</text>

      <text x="22" y="480"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">ls -la ~/.ssh</tspan></text>
      <text x="22" y="501" fill="#6e7681">nice try :)</text>

      <text x="22" y="532"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">cat ~/.setup</tspan></text>
      <text x="22" y="553" fill="#8b949e">os: linux · shell: zsh · editor: vscode</text>
      <text x="22" y="573" fill="#8b949e">wm: whatever tiles · theme: green on black</text>

      <text x="22" y="604"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan class="bk" fill="#00ff88">▌</tspan></text>
    </g>
    <rect width="520" height="640" fill="url(#tscan)"/>
    <path d="M0 0.5h520" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="637" width="520" height="3" fill="url(#trule)"/>
  </g>

  <rect x="0.5" y="0.5" width="519" height="639" rx="12"
        fill="none" stroke="#30363d" stroke-opacity="0.85"/>
</svg>
