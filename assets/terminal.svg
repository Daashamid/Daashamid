<svg xmlns="http://www.w3.org/2000/svg" width="400" height="608" viewBox="0 0 400 608"
     role="img" aria-label="Terminal session: whoami, stack, projects, toolbox, lessons, learning status">
  <title>hamid@arch — a fake terminal with honest output</title>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="trule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00ff88" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tchrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#00ff88" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="tscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity="0.014"/>
    </pattern>
    <clipPath id="tcard"><rect width="400" height="608" rx="12"/></clipPath>
  </defs>

  <style>
    .m  { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code",
          Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
    .bk { animation: bk 1.05s steps(1, end) infinite; }
    @keyframes bk { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
    .lv { animation: lv 2.6s ease-in-out infinite; }
    @keyframes lv { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
    /* one pattern period, so the drift loops without a seam */
    .tpar { animation: tpar 26s linear infinite; }
    @keyframes tpar { 0% { transform: translate(0, 0) } 100% { transform: translate(-26px, -26px) } }
    .ted { animation: ted 11s linear infinite; }
    @keyframes ted { 0% { transform: translateX(0) } 100% { transform: translateX(560px) } }
  </style>

  <g clip-path="url(#tcard)">
    <rect width="400" height="608" fill="url(#tbg)"/>
    <rect class="tpar" x="-30" y="-30" width="460" height="668" fill="url(#tgrid)"/>
    <ellipse cx="70" cy="570" rx="300" ry="230" fill="url(#tglow)"/>

    <!-- title bar -->
    <rect width="400" height="34" fill="#0d1117"/>
    <rect width="400" height="34" fill="url(#tchrome)"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
    <circle cx="39" cy="17" r="5" fill="#febc2e"/>
    <circle cx="58" cy="17" r="5" fill="#28c840"/>
    <text class="m" x="200" y="22" font-size="12" text-anchor="middle" letter-spacing="0.4"
      ><tspan fill="#8b949e">hamid@arch</tspan><tspan fill="#484f58">: ~</tspan></text>
    <path d="M0 34h400" stroke="#30363d" stroke-opacity="0.8"/>

    <g class="m" letter-spacing="0.2">
      <text x="18" y="58"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">whoami</tspan></text>
      <text x="18" y="78" fill="#8b949e">hamid · python developer · neyshabour</text>

      <text x="18" y="106"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">cat ~/stack.txt</tspan></text>
      <text x="18" y="126" fill="#00ff88">python<tspan fill="#6e7681" dx="14"
        ># the one I'm good at</tspan></text>
      <text x="18" y="146" fill="#8b949e">linux · git · c · html/css<tspan fill="#6e7681" dx="14"
        ># homework</tspan></text>
      <text x="18" y="166" fill="#8b949e">network+<tspan fill="#6e7681" dx="14"
        ># studying right now</tspan></text>

      <text x="18" y="194"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">ls ~/projects</tspan></text>
      <text x="18" y="214" fill="#79c0ff">auto-wifi-biruni  backlight-keyboard</text>

      <text x="18" y="242"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">cat ~/.toolbox</tspan></text>
      <text x="18" y="262" fill="#8b949e">python · bash · git · systemd</text>
      <text x="18" y="282" fill="#8b949e">selenium · evdev · requests</text>

      <text x="18" y="310"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">tail -3 ~/.lessons</tspan></text>
      <text x="18" y="330" fill="#6e7681"><tspan fill="#00ff88">&gt;</tspan><tspan dx="6"
        >read the error before you google it</tspan></text>
      <text x="18" y="350" fill="#6e7681"><tspan fill="#00ff88">&gt;</tspan><tspan dx="6"
        >if it runs once, put it on a timer</tspan></text>
      <text x="18" y="370" fill="#6e7681"><tspan fill="#00ff88">&gt;</tspan><tspan dx="6"
        >nothing is learned until it breaks</tspan></text>

      <text x="18" y="398"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">systemctl status learning</tspan></text>
      <text x="18" y="418"><tspan class="lv" fill="#28c840">●</tspan><tspan fill="#8b949e" dx="6"
        >learning.service — </tspan><tspan fill="#00ff88">active</tspan></text>
      <text x="34" y="438" fill="#6e7681">since 2025-07 · restarts: many</text>
      <text x="34" y="458" fill="#6e7681">next: subnetting, until it's boring</text>

      <text x="18" y="486"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">ls -la ~/.ssh</tspan></text>
      <text x="18" y="506" fill="#6e7681">nice try :)</text>

      <text x="18" y="534"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">cat ~/.setup</tspan></text>
      <text x="18" y="554" fill="#8b949e">os: linux · shell: zsh · vscode</text>
      <text x="18" y="574" fill="#8b949e">theme: green on black, always</text>

      <text x="18" y="598"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan
        ><tspan fill="#00ff88">$ </tspan><tspan class="bk" fill="#00ff88">▌</tspan></text>
    </g>

    <rect width="400" height="608" fill="url(#tscan)"/>
    <path d="M0 0.5h400" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect class="ted" x="-160" y="0" width="160" height="2" fill="url(#trule)"/>
    <rect x="0" y="605" width="400" height="3" fill="url(#trule)"/>
  </g>

  <rect x="0.5" y="0.5" width="399" height="607" rx="12"
        fill="none" stroke="#30363d" stroke-opacity="0.85"/>
</svg>
