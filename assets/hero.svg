<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240"
     role="img" aria-label="HAMID.py — Python Developer, Linux, Security Learner">
  <title>HAMID.py — Python Developer · Linux · Security Learner</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#05070a"/>
      <stop offset="52%"  stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#04140d"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff88"/>
      <stop offset="55%"  stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="72%"  stop-color="#00c8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#00ff88" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="240" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code",
            Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .blink { animation: blink 1.05s steps(1, end) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-420px) } 100% { transform: translateX(1000px) } }
    .pulse { animation: pulse 5.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <ellipse class="pulse" cx="180" cy="150" rx="420" ry="230" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="0" width="420" height="240" fill="url(#sweep)"/>

    <!-- terminal chrome -->
    <circle cx="34" cy="28" r="5" fill="#ff5f57"/>
    <circle cx="54" cy="28" r="5" fill="#febc2e"/>
    <circle cx="74" cy="28" r="5" fill="#28c840"/>
    <text class="mono" x="98" y="33" font-size="13" fill="#6e7681"
          letter-spacing="0.6">hamid@arch:~/profile</text>
    <path d="M0 50h1000" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- wordmark -->
    <text class="mono" x="62" y="142" font-size="66" font-weight="700" letter-spacing="1.5">
      <tspan fill="#f0f6fc">HAMID</tspan><tspan fill="url(#accent)">.py</tspan>
    </text>

    <!-- strapline -->
    <text class="mono" x="66" y="184" font-size="16.5" letter-spacing="0.4">
      <tspan fill="#00ff88">$</tspan><tspan fill="#8b949e" dx="9">python developer</tspan
      ><tspan fill="#30363d" dx="9">·</tspan><tspan fill="#8b949e" dx="9">linux</tspan
      ><tspan fill="#30363d" dx="9">·</tspan><tspan fill="#8b949e" dx="9">security learner</tspan>
    </text>
    <rect class="blink" x="529" y="171" width="9" height="17" fill="#00ff88"/>

    <!-- faint code texture, right side -->
    <g class="mono" font-size="12.5" fill="#00ff88" opacity="0.12" letter-spacing="0.3">
      <text x="672" y="78">class Hamid:</text>
      <text x="692" y="100">stack = [python, bash]</text>
      <text x="692" y="122">os    = linux</text>
      <text x="692" y="144">next  = network+</text>
      <text x="692" y="166">goal  = pentest</text>
      <text x="672" y="196">while alive: learn()</text>
    </g>

    <rect x="0" y="236" width="1000" height="4" fill="url(#rule)"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="239" rx="16"
        fill="none" stroke="#30363d" stroke-opacity="0.85" stroke-width="1"/>
</svg>
