<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110"
     role="img" aria-label="$ exit — thanks for scrolling">
  <title>$ exit</title>

  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#04140d"/>
      <stop offset="50%"  stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00c8ff" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#00c8ff" stop-opacity="0.55"/>
      <stop offset="82%"  stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#00ff88" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="fcard"><rect width="1000" height="110" rx="14"/></clipPath>
  </defs>

  <style>
    .fm { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code",
          Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .fbk { animation: fbk 1.05s steps(1, end) infinite; }
    @keyframes fbk { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
  </style>

  <g clip-path="url(#fcard)">
    <rect width="1000" height="110" fill="url(#fbg)"/>
    <rect width="1000" height="110" fill="url(#fgrid)"/>
    <ellipse cx="820" cy="60" rx="360" ry="120" fill="url(#fglow)"/>

    <rect x="0" y="0" width="1000" height="3" fill="url(#frule)"/>

    <text class="fm" x="500" y="50" font-size="15" text-anchor="middle" letter-spacing="0.4">
      <tspan fill="#00ff88">$</tspan><tspan fill="#f0f6fc" dx="9">exit</tspan
      ><tspan fill="#484f58" dx="14">#</tspan><tspan fill="#6e7681" dx="7"
      >thanks for scrolling — now go break something</tspan>
    </text>

    <text class="fm" x="500" y="80" font-size="12.5" text-anchor="middle"
          letter-spacing="0.5"><tspan fill="#00c8ff">hamid@arch</tspan><tspan
      fill="#484f58">:~/profile</tspan><tspan fill="#00ff88">$ </tspan><tspan
      class="fbk" fill="#00ff88">▌</tspan></text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="109" rx="14"
        fill="none" stroke="#30363d" stroke-opacity="0.85" stroke-width="1"/>
</svg>
