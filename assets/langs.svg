<svg xmlns="http://www.w3.org/2000/svg" width="500" height="260" viewBox="0 0 500 260" role="img" aria-label="Language distribution across all repos">
  <title>Language distribution across all repos</title>
  <defs>
    <linearGradient id="bgl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/><stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="rulel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ff88" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="filll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/><stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <linearGradient id="chromel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="gridl" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#00ff88" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="cardl"><rect width="500" height="260" rx="12"/></clipPath>
  </defs>
  <style>
    /* font-size lives on the wrapping group, not here: a CSS rule would override every
       per-element font-size="…" presentation attribute and silently overflow the card.
       Keep angle brackets out of this comment — SVG is parsed as XML, not HTML. */
    .ml { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .edl { animation: edl 9s linear infinite; }
    @keyframes edl {
      0%   { transform: translateX(0) }
      100% { transform: translateX(700px) }
    }
  </style>
  <g clip-path="url(#cardl)">
    <rect width="500" height="260" fill="url(#bgl)"/>
    <rect width="500" height="260" fill="url(#gridl)"/>
    <rect width="500" height="38" fill="#0d1117"/>
    <rect width="500" height="38" fill="url(#chromel)"/>
    <circle cx="24" cy="19" r="5" fill="#ff5f57"/>
    <circle cx="43" cy="19" r="5" fill="#febc2e"/>
    <circle cx="62" cy="19" r="5" fill="#28c840"/>
    <text class="ml" x="250" y="24" font-size="12.5" text-anchor="middle"
          letter-spacing="0.4"><tspan fill="#8b949e">hamid@arch</tspan><tspan fill="#484f58">: ~/repos</tspan></text>
    <path d="M0 38h500" stroke="#30363d" stroke-opacity="0.8"/>
    <path d="M0 0.5h500" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect class="edl" x="-200" y="0" width="200" height="2" fill="url(#rulel)"/>
    <g class="ml" letter-spacing="0.2" font-size="12.5">
      <text class="ml" x="20" y="60"><tspan fill="#00c8ff">hamid@arch</tspan><tspan fill="#484f58">:~</tspan><tspan fill="#00ff88">$ </tspan><tspan fill="#f0f6fc">cloc ~/repos --all</tspan></text>
      <text class="ml" x="20" y="80" fill="#6e7681" font-size="11"># 11 repos · 12 languages · 3.4 MB indexed</text>
      <clipPath id="barl"><rect x="20" y="96" width="460" height="16" rx="8.0"/></clipPath>
      <g clip-path="url(#barl)">
        <rect x="20" y="96" width="460" height="16" fill="#161b22"/>
        <rect x="20.00" y="96" width="149.54" height="16" fill="#3572A5"/>
        <rect x="169.54" y="96" width="122.12" height="16" fill="#dea584"/>
        <rect x="291.66" y="96" width="82.55" height="16" fill="#00B4AB"/>
        <rect x="374.21" y="96" width="49.71" height="16" fill="#4A76B8"/>
        <rect x="423.92" y="96" width="30.42" height="16" fill="#A97BFF"/>
        <rect x="454.34" y="96" width="11.57" height="16" fill="#89e051"/>
        <rect x="465.91" y="96" width="4.97" height="16" fill="#e34c26"/>
        <rect x="470.88" y="96" width="9.12" height="16" fill="#484f58"/>
      </g>
      <rect x="20.5" y="96.5" width="459" height="15" rx="8.0" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="24" cy="142" r="4.5" fill="#3572A5"/>
      <text class="ml" x="36" y="146" fill="#8b949e">Python</text>
      <text class="ml" x="232" y="146" fill="#f0f6fc" text-anchor="end">32.5%</text>
      <circle cx="24" cy="166" r="4.5" fill="#dea584"/>
      <text class="ml" x="36" y="170" fill="#8b949e">Rust</text>
      <text class="ml" x="232" y="170" fill="#f0f6fc" text-anchor="end">26.5%</text>
      <circle cx="24" cy="190" r="4.5" fill="#00B4AB"/>
      <text class="ml" x="36" y="194" fill="#8b949e">Dart</text>
      <text class="ml" x="232" y="194" fill="#f0f6fc" text-anchor="end">17.9%</text>
      <circle cx="24" cy="214" r="4.5" fill="#4A76B8"/>
      <text class="ml" x="36" y="218" fill="#8b949e">MQL5</text>
      <text class="ml" x="232" y="218" fill="#f0f6fc" text-anchor="end">10.8%</text>
      <circle cx="262" cy="142" r="4.5" fill="#A97BFF"/>
      <text class="ml" x="274" y="146" fill="#8b949e">Kotlin</text>
      <text class="ml" x="470" y="146" fill="#f0f6fc" text-anchor="end">6.6%</text>
      <circle cx="262" cy="166" r="4.5" fill="#89e051"/>
      <text class="ml" x="274" y="170" fill="#8b949e">Shell</text>
      <text class="ml" x="470" y="170" fill="#f0f6fc" text-anchor="end">2.5%</text>
      <circle cx="262" cy="190" r="4.5" fill="#e34c26"/>
      <text class="ml" x="274" y="194" fill="#8b949e">HTML</text>
      <text class="ml" x="470" y="194" fill="#f0f6fc" text-anchor="end">1.1%</text>
      <circle cx="262" cy="214" r="4.5" fill="#484f58"/>
      <text class="ml" x="274" y="218" fill="#8b949e">other</text>
      <text class="ml" x="470" y="218" fill="#f0f6fc" text-anchor="end">2.0%</text>
      <text class="ml" x="20" y="243" font-size="11" fill="#484f58"># bytes on disk, not skill — see ./progress.sh</text>
    </g>
    <rect x="0" y="257" width="500" height="3" fill="url(#rulel)"/>
  </g>
  <rect x="0.5" y="0.5" width="499" height="259" rx="12" fill="none"
        stroke="#30363d" stroke-opacity="0.85"/>
</svg>
